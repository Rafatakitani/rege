[package]
name = "rege"
version = "0.1.0"
edition = "2021"
description = "Orquestrador multi-agente de IAs: um mestre comanda CLIs de IA isolados em git worktree + tmux."
license = "MIT"

[[bin]]
name = "rege"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
base64 = "0.22"

[profile.release]
opt-level = 2
