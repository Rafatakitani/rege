[package]
name = "rege"
version = "0.15.2"
edition = "2021"
description = "Multi-agent AI orchestrator: a master commands AI CLIs isolated in git worktrees + tmux."
license = "MIT"

[[bin]]
name = "rege"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
base64 = "0.22"

[profile.release]
opt-level = 2

# Used only by `rege update`: what gets optimized here is compile time, not the
# binary. rege waits on AI CLIs and paints a screen — it is IO-bound, and
# opt-level 1 nearly halves the build at no perceptible cost. The `release`
# profile (the one that ships) stays intact.
#
# The rest is pure build time, with no change in semantics: more codegen units
# to keep every core busy (`release` uses 16 and leaves the machine idle), and
# strip, because writing a symbol table is link time nobody will spend. Left
# out on purpose: `incremental`, since `cargo install --git` clones into a fresh
# directory every time and no incremental state survives from one update to the
# next — only the cost of writing it; and `panic`, since changing it would make
# the binary installed by `update` behave differently from the packaged one.
[profile.fastinstall]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false
debug = false
strip = true
